<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蛙抵家 2.0 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Source+Code+Pro:wght@400;500&family=Source+Serif+4:ital,wght@1,400;1,600&display=swap">
<style>
/* Layout: one phone-width column; app bar on top, instrument panels (always dark, like a field recorder) in the flow, tab bar pinned to the bottom. Night-first, per Brief v1.6. */
:root{
  --bg:#0c1411; --surface:#131e19; --surface-2:#1a2822; --line:#2b3c34;
  --fg:#e3e9dd; --fg-muted:#9cad9e; --fg-faint:#728476;
  --accent:#9cc47c; --accent-ink:#0c1411; --accent-soft:rgba(156,196,124,.14);
  --water:#79bab2; --water-soft:rgba(121,186,178,.14);
  --amber:#e2b357; --amber-soft:rgba(226,179,87,.13);
  --alert:#e8937a; --alert-soft:rgba(232,147,122,.13);
  --ok:#8ccd9f;
  --scope-bg:#08100d; --scope-fg:#cfe3d2; --scope-shade:rgba(8,16,13,.66);
  --quiet-bg:#000000; --quiet-fg:#7f9283;
  --font-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-sci:"Source Serif 4","Noto Serif TC",Georgia,serif;
  --font-data:"Source Code Pro",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.1875rem; --fs-xl:1.5rem; --fs-2xl:2rem;
  --r-md:14px; --r-lg:22px;
  --tabbar-h:62px;
  color-scheme:dark;
}
:root[data-app-theme="light"],
:root[data-theme="light"]:not([data-app-theme]){
  --bg:#edf2ea; --surface:#fbfcf9; --surface-2:#e2eadf; --line:#c5d2c2;
  --fg:#16241c; --fg-muted:#4b5d51; --fg-faint:#6b7c70;
  --accent:#3b7833; --accent-ink:#ffffff; --accent-soft:rgba(59,120,51,.12);
  --water:#226f69; --water-soft:rgba(34,111,105,.11);
  --amber:#875b06; --amber-soft:rgba(176,124,20,.13);
  --alert:#a0412a; --alert-soft:rgba(160,65,42,.10);
  --ok:#2b7745;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
button,input,select{font:inherit;color:inherit}
a{color:var(--water)}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1{font-size:var(--fs-xl);line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:var(--fs-lg);line-height:1.35;margin:6px 0 0;font-weight:600;text-wrap:balance}
h3{font-size:var(--fs-lg);line-height:1.3;margin:0;font-weight:600}
p{margin:0}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--fg-muted)} .faint{color:var(--fg-faint)} .small{font-size:var(--fs-sm)} .center{text-align:center}
.sci{font-family:var(--font-sci);font-style:italic;color:var(--fg-muted)}
.data{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--fg-muted);margin:0}
.stack{display:grid;gap:16px;min-width:0}
.stack.tight{gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row.tight{gap:8px}
.row.between{justify-content:space-between}
.row > .grow{flex:1 1 auto}

/* App frame */
.app{max-width:440px;margin:0 auto}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .mark{width:28px;height:28px;color:var(--accent);flex:none}
.brand .name{font-weight:700;font-size:var(--fs-lg);letter-spacing:.02em}
.brand .ver{font-size:var(--fs-xs);color:var(--fg-muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.env{font-size:var(--fs-xs);color:var(--water);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.view{padding-block:20px calc(var(--tabbar-h) + 36px + env(safe-area-inset-bottom,0px));min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:grid;justify-items:center;gap:1px;padding:6px 0 4px;color:var(--fg-muted);text-decoration:none;font-size:var(--fs-xs);border-radius:12px}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;
  border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.3}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.quiet{background:transparent;color:var(--fg-muted);min-height:40px;padding:0 8px;font-weight:500}
.btn.sm{min-height:38px;padding:0 12px;font-size:var(--fs-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.back{justify-self:start;padding-left:0}
.link{background:none;border:0;padding:0;color:var(--water);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:var(--fs-sm);justify-self:start}

/* Pills, meters, callouts */
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:var(--fs-xs);border:1px solid var(--line);color:var(--fg-muted);white-space:nowrap;line-height:1.7}
.pill.ok{color:var(--ok);border-color:currentColor}
.pill.wait{color:var(--amber);border-color:currentColor}
.pill.info{color:var(--water);border-color:currentColor}
.pill.alien,.pill.diff{color:var(--alert);border-color:currentColor}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:22px;height:9px;border-radius:2px;background:var(--line)}
.meter.sm i{width:14px;height:7px}
.meter i.on{background:var(--accent)}
.meter.low i.on{background:var(--amber)}
.callout{border-radius:var(--r-md);padding:12px 14px;display:grid;gap:4px;font-size:var(--fs-sm)}
.callout strong{font-weight:600}
.callout.ethic{background:var(--amber-soft)} .callout.ethic strong{color:var(--amber)}
.callout.diff{background:var(--alert-soft)} .callout.diff strong{color:var(--alert)}
.callout.info{background:var(--water-soft)} .callout.info strong{color:var(--water)}
.callout ul{margin:2px 0 0;padding-left:1.2em;display:grid;gap:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:grid;gap:8px;min-width:0}

/* Instruments (always dark) */
.scope{background:var(--scope-bg);border-radius:var(--r-md);overflow:hidden;position:relative}
.scope canvas{display:block;width:100%;height:100%}
.scope.wave{height:110px} .scope.spec{height:150px} .scope.overview{height:124px} .scope.tall{height:190px}
.axis{position:absolute;right:6px;top:0;bottom:0;pointer-events:none}
.axis span{position:absolute;right:0;transform:translateY(-50%);font-family:var(--font-data);font-size:11px;color:var(--scope-fg);opacity:.72}
.scope-tag{position:absolute;left:8px;top:6px;font-size:11px;font-family:var(--font-data);color:var(--scope-fg);opacity:.72}

/* Record home */
.hero-rec{display:grid;justify-items:center;gap:14px;padding-block:22px 6px}
.rec{position:relative;width:168px;height:168px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.rec::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--accent);animation:breathe 4.8s ease-in-out infinite}
.rec .dot{width:62px;height:62px;border-radius:50%;background:var(--accent)}
.rec-caption{color:var(--fg-muted);font-size:var(--fs-sm)}
@keyframes breathe{0%,100%{transform:scale(.95);opacity:.22}50%{transform:scale(1.04);opacity:.55}}
.last{display:grid;gap:2px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer}
.countdown{font-family:var(--font-data);font-size:3.25rem;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.countdown small{font-size:var(--fs-md);color:var(--fg-muted);margin-left:4px}
.flow-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}
.step{font-size:var(--fs-sm);color:var(--fg-muted)}

/* Trim */
.trim{position:relative;height:124px}
.trim .scope{position:absolute;inset:0}
.shade{position:absolute;top:0;bottom:0;background:var(--scope-shade);pointer-events:none}
.shade.l{left:0} .shade.r{right:0}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--scope-fg);pointer-events:none}
.trim input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none}
.trim input[type=range]::-webkit-slider-runnable-track{height:124px;background:transparent;border:0}
.trim input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:124px;border-radius:6px;background:var(--accent);border:3px solid var(--scope-bg);cursor:ew-resize}
.trim input[type=range]::-moz-range-track{background:transparent;border:0}
.trim input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:118px;border-radius:6px;background:var(--accent);border:3px solid var(--scope-bg);cursor:ew-resize}
.trim input[type=range]:focus-visible{outline:2px solid var(--water);outline-offset:2px}

/* Analyzing */
.analyzing{display:grid;justify-items:center;gap:18px;padding-block:56px 24px;text-align:center}
.pulse{width:116px;height:116px;border-radius:50%;border:1px solid var(--water);animation:breathe 2.2s ease-in-out infinite}

/* Guess */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip:hover{border-color:var(--accent)}

/* Result */
.summary{display:grid;gap:6px}
.summary .level{display:flex;align-items:center;gap:10px;font-size:var(--fs-lg);font-weight:600}
ol.cands{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cand{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.cand .rank{color:var(--fg-faint);font-size:var(--fs-sm);padding-top:3px}
.cand-main{display:grid;gap:8px;min-width:0}
.cand-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hint{font-size:var(--fs-sm);color:var(--fg-faint)}
.compare{border:1px dashed var(--water);border-radius:var(--r-md);padding:14px;display:grid;gap:8px}
.ab-now{font-size:var(--fs-sm);color:var(--water);min-height:1.4em}
.scope-note{display:grid;gap:8px;font-size:var(--fs-sm);color:var(--fg-muted)}
.hidden-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hidden-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface-2);color:var(--fg)}
.decide{display:grid;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.reasons{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* Save */
.field{display:grid;gap:6px}
.field > span{font-size:var(--fs-sm);color:var(--fg-muted)}
input.text,select.text{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;width:100%}
ul.flist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.flist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
ul.flist .who{display:grid;gap:2px;min-width:0}
ul.flist .who span{overflow-wrap:anywhere}
ul.flist .row{flex-wrap:nowrap;flex:none}
.seg{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.seg legend{font-size:var(--fs-sm);color:var(--fg-muted);padding:0;margin-bottom:6px}
.seg label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent)}
.seg input{margin-top:5px;accent-color:var(--accent)}
.seg .opt{display:grid;gap:2px}
details.box{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
details.box summary{cursor:pointer;font-size:var(--fs-sm);color:var(--fg-muted)}
details.box[open] summary{margin-bottom:10px}
.dwc{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 12px;margin:0;font-size:var(--fs-xs)}
.dwc dt{font-family:var(--font-data);color:var(--water)}
.dwc dd{margin:0;overflow-wrap:anywhere}

/* Saved / tracker */
.tracker{list-style:none;margin:0;padding:0;counter-reset:step;display:grid}
.tracker li{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:12px;padding:10px 0;counter-increment:step}
.tracker li::before{content:counter(step);grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--font-data);font-size:var(--fs-xs);color:var(--fg-muted)}
.tracker li.done::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tracker li.now::before{border-color:var(--amber);color:var(--amber)}
.tracker li span{font-size:var(--fs-sm);color:var(--fg-muted)}

/* Records */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:0}
.stat b{font-family:var(--font-data);font-size:var(--fs-xl);font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-xs);color:var(--fg-muted)}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;text-decoration:none;color:var(--fg)}
.item .t{font-weight:600}
.item .m{font-size:var(--fs-sm);color:var(--fg-muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:6px 12px;margin:0;font-size:var(--fs-sm)}
.kv dt{color:var(--fg-muted)}
.kv dd{margin:0;text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv.wide{grid-template-columns:auto minmax(0,1fr)}
.kv.wide dd{font-family:inherit;text-align:left}
.saved-mark{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.saved-mark svg{width:34px;height:34px}

/* Tour */
.site-head{display:grid;gap:4px}
ol.route{margin:0;padding-left:1.4em;display:grid;gap:6px}
.sp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sp-row:last-child{border-bottom:0}
.quiet-overlay{position:fixed;inset:0;z-index:70;background:var(--quiet-bg);color:var(--quiet-fg);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.quiet-inner{display:grid;justify-items:center;gap:18px;text-align:center}
.quiet-ring{width:160px;height:160px;border-radius:50%;border:1px solid var(--quiet-fg);animation:breathe 6s ease-in-out infinite}
.quiet-t{font-family:var(--font-data);font-size:var(--fs-2xl);letter-spacing:.04em}
.quiet-overlay .btn.ghost{color:var(--quiet-fg);border-color:var(--quiet-fg)}

/* Soundscape */
.chart{margin:0}
.chart svg{display:block;width:100%;height:auto}
.chart .bf{fill:var(--accent)} .chart .bo{fill:var(--water)}
.chart .ax{fill:var(--fg-muted);font-size:11px;font-family:var(--font-data)}
.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-xs);color:var(--fg-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .lf{background:var(--accent)} .legend .lo{background:var(--water)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.nums div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.nums dt{font-size:var(--fs-xs);color:var(--fg-muted)}
.nums dd{margin:0;font-family:var(--font-data);font-size:var(--fs-xl);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:500;color:var(--fg-muted);font-size:var(--fs-xs)}
.tbl th.num{text-align:right}
.tbl td.num{text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums}

/* Diagnostics */
.specplot{margin:0;display:grid;gap:6px}
.specplot svg{display:block;width:100%;height:auto}
.specplot .ln{fill:none;stroke:var(--water);stroke-width:1.6}
.specplot .gl{stroke:var(--line);stroke-width:1}
.specplot .ax{fill:var(--fg-muted);font-size:10.5px;font-family:var(--font-data)}
.specplot .mk{stroke:var(--amber);stroke-width:1.2;stroke-dasharray:3 3}
.specplot .mkt{fill:var(--amber)}
.levelbar{display:flex;gap:10px;align-items:center}
.levelbar .bar{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.levelbar .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:var(--fs-sm)}
pre.code{margin:0;font-family:var(--font-data);font-size:var(--fs-xs);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg-muted)}
textarea.copy{width:100%;min-height:160px;font-family:var(--font-data);font-size:var(--fs-xs);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px}

/* LINE entry schematic */
.phone{border:1px solid var(--line);border-radius:26px;background:var(--surface-2);overflow:hidden}
.phone-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}
.chat{padding:14px;display:grid;gap:12px}
.bubble{max-width:88%;padding:10px 12px;border-radius:16px 16px 16px 4px;background:var(--surface);font-size:var(--fs-sm);display:grid;gap:6px}
.bubble.me{justify-self:end;border-radius:16px 16px 4px 16px;background:var(--accent-soft)}
.bubble .pill{justify-self:start}
.bubble .open{justify-self:start;font-size:var(--fs-sm);background:none;border:0;padding:0;color:var(--water);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.richmenu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.rm{min-height:86px;display:grid;place-items:center;align-content:center;gap:4px;padding:8px 4px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:var(--fs-sm);color:var(--fg)}
.rm:nth-child(3n){border-right:0}
.rm:nth-last-child(-n+3){border-bottom:0}
.rm .ic{width:24px;height:24px;color:var(--accent)}

ul.menu{list-style:none;margin:0;padding:0;display:grid;gap:10px}

ul.menu span{font-size:var(--fs-sm);color:var(--fg-muted)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
.gate-inner{max-width:400px;margin:0 auto;display:grid;gap:18px}
.gate .mark{width:64px;height:64px;color:var(--accent)}
.gate h1{font-size:var(--fs-2xl)}
.gate ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.gate li{display:flex;gap:10px;align-items:flex-start}
.gate li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom,0px));z-index:80;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:var(--fs-sm);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

    url() { return UPLOAD_URL || store.get('uploadUrl', '') || memUrl; },

function beginCountdown(sec) {
  const f = S.flow, sess = f.session, an = sess.analyser, wave = $('#waveCv'), spec = $('#specCv');
  sizeCanvas(wave); sizeCanvas(spec); clearScope(spec); specAxis($('#specAx'), sess.sampleRate / 2);
  const f32 = new Float32Array(an.fftSize), u8 = new Uint8Array(an.fftSize), drawSpec = makeSpecDrawer(spec, an), t0 = performance.now();

  onCleanup(() => {

    if (S.flow.step === 'recording' && S.flow.session === sess) { try { sess.stopCapture(); } catch (e) { /* 忽略 */ } sess.close(); S.flow = { step: 'home', presetSite: f.presetSite }; }

}

function haversine(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
}
function locateOnce() {
  const note = $('#locNote');

  note.textContent = '正在讀取一次定位…';
  navigator.geolocation.getCurrentPosition(pos => {
    let la = pos.coords.latitude, lo = pos.coords.longitude;
    S.tour.order = SITES.map(s => ({ id: s.id, d: haversine(la, lo, s.lat, s.lon) })).sort((x, y) => x.d - y.d).map(x => x.id);
    la = null; lo = null; // 座標用完即丟
    S.tour.located = true;
    if (route() === 'tour') render();
    toast('已依距離排序，座標沒有保存。');
  }, err => {
    const n = $('#locNote'); if (n) n.textContent = '沒有取得定位（' + (err && err.code === 1 ? '權限被拒絕，或這個環境不開放定位' : '無法定位') + '）。請直接選場域。';
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 0 });
}

function hourChart() {
  const hours = ['19', '20', '21', '22', '23', '00', '01', '02', '03', '04'];
  const frogs = [8, 26, 41, 52, 47, 39, 30, 22, 15, 10], others = [3, 3, 2, 2, 2, 1, 1, 1, 1, 6];
  const W = 360, H = 190, L = 32, R = 8, T = 12, B = 28, pw = W - L - R, ph = H - T - B, max = 60;
  const y = v => T + ph - v / max * ph, bw = pw / hours.length;
  let g = '';
  [0, 20, 40, 60].forEach(v => { g += '<line class="gl" x1="' + L + '" x2="' + (L + pw) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
  hours.forEach((h, i) => {
    const x = (L + i * bw + bw * 0.19).toFixed(1), w = (bw * 0.62).toFixed(1);
    g += '<rect class="bf" x="' + x + '" y="' + y(frogs[i]).toFixed(1) + '" width="' + w + '" height="' + (frogs[i] / max * ph).toFixed(1) + '" rx="2"/>';
    g += '<rect class="bo" x="' + x + '" y="' + y(frogs[i] + others[i]).toFixed(1) + '" width="' + w + '" height="' + (others[i] / max * ph).toFixed(1) + '" rx="1"/>';
    if (i % 2 === 0) g += '<text class="ax" x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + h + ':00</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每小時判讀數：蛙類在 22 點最多，共 52 筆">' + g + '</svg>';
}

  if (method === 'line' && LIFF.enabled && !LIFF.loggedIn()) { LIFF.login(); return; }
  const real = method === 'line' && LIFF.enabled;
  S.user = { method: method, tail: real ? (LIFF.subjectTail() || '----') : Math.random().toString(16).slice(2, 6), simulated: !real };
  store.set('user', S.user); renderGate(); render();
}
function applyTheme() {
  const t = S.settings.theme, root = document.documentElement;
  if (t === 'light') root.setAttribute('data-app-theme', 'light');
  else if (t === 'night') root.setAttribute('data-app-theme', isNight() ? 'dark' : 'light');
  else root.removeAttribute('data-app-theme');
}

/* ---------- 事件 ---------- */
const ACT = {
  login: el => login(el.dataset.m),
  logout: () => { S.user = null; store.set('user', null); renderGate(); },
  startRec: () => startMic(),
  startDemo: () => startDemo(),
  stopRec: () => finishRecording(),
  cancelFlow: () => cancelFlow(),
  playTrim: () => playTrim(),
  skipTrim: () => { const f = S.flow; f.trimA = 0; f.trimB = f.dur; f.step = 'analyzing'; render(); },
  submitTrim: () => { S.flow.step = 'analyzing'; render(); },
  playMine: () => playMine(),
  guess: el => { S.flow.guess = el.dataset.id; S.flow.step = 'result'; render(); },
  playRef: el => playRef(el.dataset.id),
  abCompare: () => abCompare(),
  toggle: el => { const t = document.getElementById(el.dataset.target); if (t) { t.hidden = !t.hidden; el.setAttribute('aria-expanded', String(!t.hidden)); } },
  decide: el => { const type = el.dataset.type; S.flow.decision = { type: type, species: type === 'expert' ? null : el.dataset.id }; S.flow.step = 'save'; render(); },
  backToResult: () => { captureSaveForm(); S.flow.step = 'result'; render(); },
  saveRecord: () => saveRecord(),
  newRec: () => { S.flow = { step: 'home', presetSite: '' }; render(); },
  retry: () => { S.flow = { step: 'home', presetSite: S.flow.presetSite || '' }; render(); },
  openRecord: el => { S.recordOpen = el.dataset.id; go('records'); },
  closeRecord: () => { S.recordOpen = null; render(); },
  playRecord: el => { const a = S.audioById[el.dataset.id]; if (a) { stopAll(); AudioEng.play(a.samples.subarray(Math.floor(a.a * a.sr), Math.max(Math.floor(a.a * a.sr) + 1, Math.floor(a.b * a.sr))), a.sr); } },
  locateOnce: () => locateOnce(),
  openSite: el => { S.tour.site = el.dataset.id; render(); },
  closeSite: () => { S.tour.site = null; render(); },
  quietMode: () => quietMode(),
  quietExit: () => quietExit(),
  recordHere: el => { const s = SITES.find(x => x.id === el.dataset.id); S.tour.site = null; S.flow = { step: 'home', presetSite: s ? s.name : '' }; go('record'); },
  openQueue: el => { S.queueOpen = el.dataset.id; render(); },
  closeQueue: () => { S.queueOpen = null; render(); },
  playQueue: el => { const q = QUEUE.find(x => x.id === el.dataset.id), sr = AudioEng.ensure().sampleRate; stopAll(); AudioEng.play(queueClip(q, sr), sr); },
  queueDecide: el => { S.queueDone[el.dataset.q] = { type: el.dataset.type, species: el.dataset.id || null }; toast('已記下你的審閱'); render(); },
  diagOpen: () => diagOpen(),
  diagRec: () => diagRec(),
  diagDownload: () => diagDownload(),
  diagShare: () => diagShare(),
  diagCopy: () => diagCopy(),
  fieldSave: () => fieldSave(),
  fieldUploadAll: () => fieldUploadAll(false),
  fieldDel: el => fieldDel(el),
  go: el => { S.recordOpen = null; S.tour.site = null; S.queueOpen = null; go(el.dataset.to); },
  toastMsg: el => toast(el.dataset.msg),
  resetAsk: () => { $('#resetBox').innerHTML = '<div class="row"><button class="btn sm" data-act="resetDo">確定清除</button><button class="btn ghost sm" data-act="resetCancel">取消</button></div>'; },
  resetCancel: () => { $('#resetBox').innerHTML = '<button class="btn ghost sm" data-act="resetAsk">清除原型資料</button>'; },
  resetDo: () => {
    store.clear(); S.user = null; S.records = seedRecords(); store.set('records', S.records); S.audioById = {}; S.queueDone = {}; S.cycle = 0;
    S.settings = Object.assign({}, DEFAULT_SETTINGS); applyTheme(); S.flow = { step: 'home', presetSite: '' };
    toast('已清除原型資料'); renderGate(); render();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileIn' && t.files && t.files[0]) handleFlowFile(t.files[0]);
  else if (t.id === 'diagFile' && t.files && t.files[0]) handleDiagFile(t.files[0]);
  else if (t.name === 'tm') { captureSaveForm(); const b = $('#dwcBox'); if (b) b.innerHTML = dwcHtml(draftRecord()); }
  else if (t.name === 'ssRule') S.ssRule = t.value;
  else if (t.name === 'pref-scenario') { S.settings.scenario = t.value; saveSettings(); }
  else if (t.name === 'pref-delay') { S.settings.delayReveal = t.value === 'on'; saveSettings(); }
  else if (t.name === 'pref-theme') { S.settings.theme = t.value; saveSettings(); applyTheme(); }
  else if (t.name === 'pref-breeding') { S.settings.previewBreeding = t.checked; saveSettings(); }
});
document.addEventListener('input', e => { if (e.target.id === 'siteIn') { captureSaveForm(); const b = $('#dwcBox'); if (b) b.innerHTML = dwcHtml(draftRecord()); } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.flow.step === 'recording') { finishRecording(); toast('切到背景時，網頁會停止錄音。'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#quiet').hidden) quietExit(); });
window.addEventListener('hashchange', render);
window.addEventListener('online', () => { if (route() === 'diagnostics') fieldAutoUpload(); });
setInterval(() => { if (S.settings.theme === 'night') applyTheme(); }, 60000);

/* ---------- 啟動 ---------- */
async function boot() {
  // LIFF 網址的 # 不一定會保留，所以也接受 ?p=頁面（例如 ?p=diagnostics）
  try { const p = new URLSearchParams(location.search).get('p'); if (p && ROUTES.indexOf(p) >= 0 && !location.hash) history.replaceState(null, '', location.pathname + location.search + '#' + p); } catch (e) { /* 忽略 */ }
  applyTheme(); renderGate(); render();
  try { await LIFF.init(); } catch (e) { S.liffError = (e && e.message) || String(e); }
  if (!S.user && LIFF.enabled && LIFF.loggedIn()) { S.user = { method: 'line', tail: LIFF.subjectTail() || '----', simulated: false }; store.set('user', S.user); }
  if (LIFF.enabled || S.liffError) { renderGate(); render(); }
}
boot();
})();

</script>
